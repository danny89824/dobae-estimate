<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>도배청년단 · 1분 가견적</title>
<meta name="description" content="평수와 벽지만 고르면 1분 만에 예상 가격. 도배청년단 1분 가견적.">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F5F1; --paper-2:#ECEAE3; --white:#FFFFFF;
  --ink:#16201B; --ink-2:#1E2B24; --ink-3:#2C3A31;
  --text:#171A18; --muted:#6E726B; --muted-2:#9AA39A;
  --point:#1F5640; --point-d:#163F2F; --point-lt:#C9A86A; --point-soft:#DCE6DF;
  --ok:#3E7A57; --warn:#B0462E;
  --line:#E2DFD6; --line-2:#D2CEC2; --line-d:#33433A;
  --maxw:740px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{background:var(--paper); color:var(--text);
  font-family:'Pretendard','SUIT','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  line-height:1.6; -webkit-font-smoothing:antialiased;}
a{color:inherit; text-decoration:none;}
.serif{font-family:'Fraunces',Georgia,serif;}
.mono{font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums;}

/* ===== Header ===== */
header{background:rgba(251,250,247,.9); backdrop-filter:saturate(150%) blur(12px); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20;}
.head-in{max-width:1000px; margin:0 auto; padding:13px 22px; display:flex; align-items:center; gap:14px;}
.brand{display:flex; align-items:center; gap:11px; color:var(--ink);}
.emblem{width:34px; height:34px; flex:none;}
.brand .wm{font-weight:900; font-size:18px; letter-spacing:-.04em; line-height:1;}
.brand .wm small{display:block; font-family:'JetBrains Mono',monospace; font-weight:500; font-size:9px; letter-spacing:.13em; color:var(--point); margin-top:3px;}
.home-link{margin-left:auto; font-size:13.5px; font-weight:700; color:var(--ink-2); display:inline-flex; align-items:center; gap:6px; padding:8px 13px; border:1px solid var(--line-2); border-radius:8px; transition:.15s;}
.home-link:hover{border-color:var(--ink); background:var(--ink); color:var(--paper);}

/* ===== Intro ===== */
.intro{text-align:center; padding:40px 22px 8px; max-width:var(--maxw); margin:0 auto;}
.eyebrow{font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:var(--point);}
.intro h1{font-size:clamp(26px,5vw,34px); font-weight:800; letter-spacing:-.04em; margin:14px 0 8px; line-height:1.12;}
.intro h1 em{font-style:normal; color:var(--point);}
.intro p{font-size:15px; color:var(--ink-3); margin:0;}
.chips{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:18px;}
.chip{font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; letter-spacing:.02em; color:var(--ink-2); background:var(--paper-2); border:1px solid var(--line); border-radius:6px; padding:6px 11px;}

/* ===== Wizard card ===== */
.wrap{max-width:var(--maxw); margin:22px auto 0; padding:0 18px;}
.card{background:var(--white); border:1.5px solid var(--ink); border-radius:14px; overflow:hidden; box-shadow:0 24px 50px -34px rgba(22,24,26,.4);}
.wiz-top{padding:16px 22px 14px; border-bottom:1px solid var(--line);}
.steprow{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px;}
.steprow .sl{font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; letter-spacing:.12em; color:var(--ink);}
.steprow .sl b{color:var(--point);}
.steprow .pct{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted);}
.segs{display:flex; gap:5px;}
.seg{flex:1; height:5px; border-radius:3px; background:var(--line); transition:background .3s, transform .3s;}
.seg.on{background:var(--point);}
.seg.cur{background:var(--point-lt);}
.pad{padding:24px 22px 26px;}
@media(max-width:560px){ .pad{padding:20px 16px 22px;} }

/* step animation */
@keyframes stepIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}
#content{animation:stepIn .32s cubic-bezier(.2,.7,.2,1);}
@media(prefers-reduced-motion:reduce){ #content{animation:none;} .seg{transition:none;} }

/* breadcrumb */
.bread{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:18px;}
.bchip{font-family:inherit; font-size:12px; font-weight:700; color:var(--ink-2); background:var(--paper-2); border:1px solid var(--line-2); border-radius:999px; padding:5px 10px 5px 12px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:.14s;}
.bchip:hover{border-color:var(--point); color:var(--point);}
.bchip .x{font-size:10px; color:var(--muted-2);}
.bchip:hover .x{color:var(--point);}

.step-head{margin-bottom:18px;}
.kicker{font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--point);}
.q-title{font-size:21px; font-weight:800; letter-spacing:-.03em; margin:7px 0 4px;}
.q-sub{font-size:13.5px; color:var(--muted);}

/* options */
.opts{display:flex; flex-direction:column; gap:10px;}
.opt{border:1.5px solid var(--line-2); background:var(--white); border-radius:12px; padding:15px 16px;
  text-align:left; cursor:pointer; transition:.15s; width:100%; font-family:inherit; color:var(--text);
  display:flex; gap:13px; align-items:flex-start; position:relative;}
.opt:hover{border-color:var(--point); background:var(--paper);}
.opt:active{transform:scale(.995);}
.opt.sel{border-color:var(--point); background:#fdf6f2; box-shadow:0 0 0 3px rgba(168,65,43,.1);}
.opt .emoji{font-size:22px; flex:none; line-height:1.3; width:38px; height:38px; display:flex; align-items:center; justify-content:center; background:var(--paper-2); border-radius:9px;}
.opt.sel .emoji{background:var(--point-soft);}
.opt .main{flex:1; min-width:0;}
.opt .ot{font-weight:800; font-size:15.5px; letter-spacing:-.02em; display:flex; align-items:center; gap:7px; flex-wrap:wrap;}
.opt .sqm{font-weight:700; font-size:11.5px; color:var(--muted-2); font-family:'JetBrains Mono',monospace;}
.opt .pill{font-size:10px; font-weight:800; letter-spacing:.02em; color:var(--point-d); background:var(--point-soft); border-radius:5px; padding:2px 7px;}
.opt .feat{display:block; font-size:12.8px; color:var(--ink-3); margin-top:4px;}
.opt .rec{display:block; font-size:12.8px; color:var(--point-d); margin-top:3px; font-weight:600;}
.opt .rec b{font-weight:800;}
.opt .brand{display:block; font-size:11.5px; color:var(--muted-2); margin-top:3px;}
.opt .note-x{display:block; font-size:11.8px; color:var(--warn); margin-top:3px;}
.opt .hint{flex:none; text-align:right; font-weight:800; color:var(--point-d); font-size:14px; white-space:nowrap; padding-top:1px; letter-spacing:-.01em;}
.opt .hint small{display:block; font-size:10px; color:var(--muted); font-weight:500;}
.opt .chk{position:absolute; top:13px; right:14px; color:var(--point); opacity:0; transition:.15s;}
.opt.sel .chk{opacity:1;}
.opt.sel .hint{padding-right:22px;}

.nav-row{display:flex; gap:10px; margin-top:18px;}
.btn{padding:14px; border-radius:9px; font-size:15px; font-weight:800; border:none; cursor:pointer; font-family:inherit; transition:.15s;}
.btn-ghost{background:var(--paper-2); color:var(--ink-2); padding:13px 18px; border:1px solid var(--line-2);}
.btn-ghost:hover{border-color:var(--ink);}
.btn-primary{background:var(--point); color:#fff; flex:1;}
.btn-primary:hover{background:var(--point-d);}

/* ===== Result ===== */
.rcard{border:1.5px solid var(--ink); border-radius:13px; overflow:hidden; margin-bottom:16px;}
.rtop{background:var(--ink); color:var(--paper); padding:13px 18px; display:flex; align-items:center; justify-content:space-between;}
.rtop .t{font-weight:800; font-size:13.5px; display:flex; align-items:center; gap:8px;}
.rtop .stamp{font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.12em; color:var(--ink); background:var(--point-lt); padding:3px 9px; border-radius:5px;}
.rbody{padding:22px;}
.rl{font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:700;}
.rprice{font-weight:800; font-size:44px; line-height:1.04; color:var(--ink); letter-spacing:-.04em; margin:6px 0 3px;}
.rprice .won{font-size:21px; color:var(--muted); margin-left:2px;}
.rrange{font-size:13px; color:var(--muted); margin-bottom:7px;}
.rvat{font-size:12.5px; color:var(--ink-3); margin-bottom:16px;} .rvat b{color:var(--ink); font-weight:800;}
.rbar{position:relative; height:7px; background:linear-gradient(90deg,var(--point-soft),var(--point-lt)); border-radius:4px;}
.rbar i{position:absolute; top:50%; width:15px; height:15px; border-radius:50%; background:var(--point); border:3px solid #fff; box-shadow:0 1px 5px rgba(0,0,0,.25); transform:translate(-50%,-50%);}
.rbar-l{display:flex; justify-content:space-between; margin-top:8px; font-weight:700; font-size:11.5px; color:var(--muted-2);}
.rbadge{display:inline-flex; align-items:center; gap:7px; margin-top:16px; font-size:12.5px; font-weight:800; color:var(--ok); background:rgba(78,123,87,.1); padding:7px 13px; border-radius:999px;}

.receipt{border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:14px;}
.receipt .rh{padding:12px 18px; border-bottom:1px solid var(--line); font-weight:800; font-size:13px;}
.rrow{display:flex; align-items:baseline; gap:12px; padding:13px 18px; font-size:14px;}
.rrow + .rrow{border-top:1px dashed var(--line-2);}
.rrow .k{color:var(--muted); font-weight:600; white-space:nowrap;}
.rrow .dots{flex:1; border-bottom:1.5px dotted var(--line-2); transform:translateY(-4px);}
.rrow .v{font-weight:700; text-align:right;}
.rnote{font-size:12px; color:var(--muted); background:var(--paper-2); border-radius:10px; padding:13px 15px; margin-bottom:18px; line-height:1.6;}
.rnote b{color:var(--ink);}

/* ===== Lead form ===== */
.form-card{border:1.5px solid var(--point); border-radius:13px; padding:20px 18px; background:#fdf8f5;}
.form-card h3{margin:0 0 3px; font-size:18px; font-weight:800; letter-spacing:-.02em;}
.form-card .fh{font-size:12.5px; color:var(--muted); margin-bottom:16px;}
.field{margin-bottom:12px;}
.field label{display:block; font-size:12.5px; font-weight:700; color:var(--ink-2); margin-bottom:5px;}
.field label .req{color:var(--warn);}
.field input, .field select{width:100%; padding:12px 13px; border:1.4px solid var(--line-2); border-radius:9px; font-size:14.5px; font-family:inherit; background:#fff; color:var(--text);}
.field input:focus, .field select:focus{outline:none; border-color:var(--point); box-shadow:0 0 0 3px rgba(168,65,43,.1);}
.row2{display:flex; gap:10px;} .row2 .field{flex:1;}
.err{font-size:11.5px; color:var(--warn); margin-top:4px; display:none;}

.consult-box{background:var(--paper-2); border:1px solid var(--line); border-radius:12px; padding:24px; text-align:center; margin-bottom:16px;}
.consult-box .ce{width:46px; height:46px; margin:0 auto 10px; color:var(--point);}
.consult-box h2{font-size:19px; margin:0 0 4px; font-weight:800; color:var(--ink);}
.consult-box p{font-size:13.5px; color:var(--ink-3); margin:0;}

.center{text-align:center;}
.done .de{width:62px; height:62px; margin:8px auto 14px; color:var(--ok);}
.done h2{font-size:22px; font-weight:800; margin:0 0 10px; letter-spacing:-.02em;}
.done p{color:var(--ink-3); font-size:14px; margin:0 0 5px;}
.done p b{color:var(--ink);}
.restart{background:none; border:none; color:var(--muted); font-size:12.5px; text-decoration:underline; cursor:pointer; font-family:inherit; margin-top:14px;}

/* ===== Trust ===== */
.trust{max-width:var(--maxw); margin:34px auto 0; padding:0 18px;}
.trust h2{font-size:16px; font-weight:800; text-align:center; margin:0 0 16px; letter-spacing:-.02em;}
.badges{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.badge-c{background:var(--white); border:1px solid var(--line); border-radius:11px; padding:14px; display:flex; gap:11px; align-items:center; font-size:13.5px; font-weight:700;}
.badge-c .bi{flex:none; width:34px; height:34px; border-radius:9px; background:var(--paper-2); color:var(--point); display:flex; align-items:center; justify-content:center;}
.social{display:flex; gap:10px; margin:14px auto 0; max-width:var(--maxw); padding:0 18px;}
.social a{flex:1; text-align:center; border-radius:10px; padding:13px; font-size:13.5px; font-weight:800; border:1.5px solid var(--line-2); background:var(--white); display:flex; align-items:center; justify-content:center; gap:8px;}
.social a:hover{border-color:var(--point); color:var(--point);}
footer{text-align:center; color:var(--muted-2); font-size:11.5px; padding:26px 18px 40px; line-height:1.6;}
</style>
</head>

}
function bindLeadForm(isConsult){
  const btn=document.getElementById('f_submit'); if(!btn) return;
  const pe=document.getElementById('f_phone');
  pe.addEventListener('input',function(){ let d=this.value.replace(/\D/g,'').slice(0,11);
    if(d.length>7)this.value=d.replace(/(\d{3})(\d{4})(\d+)/,'$1-$2-$3');
    else if(d.length>3)this.value=d.replace(/(\d{3})(\d+)/,'$1-$2'); else this.value=d; });
  btn.onclick=function(){
    const name=(document.getElementById('f_name').value||'').trim();
    const phone=(document.getElementById('f_phone').value||'').trim();
    const digits=phone.replace(/\D/g,''); let ok=true;
    if(!name){ document.getElementById('f_name').style.borderColor='var(--warn)'; ok=false; }
    if(digits.length<10||digits.length>11){ document.getElementById('e_phone').style.display='block'; ok=false; } else { document.getElementById('e_phone').style.display='none'; }
    if(!ok) return;
    const lead={ ts:new Date().toISOString(), type:isConsult?'상담':'실측예약', name, phone,
      when:document.getElementById('f_when').value, region:document.getElementById('f_region').value,
      estimate:isConsult?null:compute().p,
      selection:{space:S.space,size:S.size,wallpaper:S.wallpaper,grade:S.grade,method:S.method,scope:S.scope} };
    try{ const a=JSON.parse(localStorage.getItem('dobae_leads')||'[]'); a.push(lead); localStorage.setItem('dobae_leads',JSON.stringify(a)); }catch(e){}
    renderDone(isConsult, lead);
  };
}
function renderDone(isConsult, lead){
  updateProgress('done'); C.innerHTML='';
  C.appendChild(el(`<div class="done center"><div class="de"><svg width="62" height="62" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.6"/><path d="M8 12.5l2.5 2.5L16 9" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <h2>${isConsult?'상담 신청 완료':'예약 신청 완료'}</h2>
    <p><b>${lead.name}</b> 님, 신청이 접수되었습니다.</p>
    <p>입력하신 <b>${lead.phone}</b> 로<br>영업일 기준 빠르게 연락드릴게요.</p>
    ${lead.estimate?`<p style="margin-top:10px;">예상 가견적 <b>약 ${lead.estimate}만원</b> · 실측 후 확정</p>`:''}
    <button class="restart" onclick="reset()">처음부터 다시 견적내기</button></div>`));
  C.style.animation='none'; void C.offsetWidth; C.style.animation='';
  window.scrollTo({top:0,behavior:'smooth'});
}
render();
</script>
